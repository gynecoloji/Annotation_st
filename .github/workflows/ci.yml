name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        extras: ["core", "spatioloji"]
    env:
      MPLBACKEND: Agg
      NUMBA_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Install spatioloji_s (bridge tests)
        if: matrix.extras == 'spatioloji'
        run: pip install "spatioloji-s"
      - name: Lint (informational)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check --select=E9,F63,F7,F82 src tests tools
      - name: Unit and end-to-end tests on synthetic data
        run: python -m pytest tests -q
      - name: Package data is complete
        run: |
          annot-st markers > /dev/null
          annot-st init-config -o /tmp/example.yaml
          annot-st validate -c /tmp/example.yaml --stages lineage caf csc immune merge spatial
